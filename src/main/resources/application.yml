# 1. Database Connection (PostgreSQL)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 2. JPA / Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true # 기존 DB를 V0으로 기준점을 잡고, V1부터 실행하겠다는 의미
    baseline-version: 0
    schemas: public


# 3. Logging & Debugging
logging:
  level:
    org.hibernate.orm.jdbc.bind: trace