name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 기존 ECR commit SHA. 비우면 현재 main SHA를 빌드합니다."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      PARAMETER_PATH: ${{ vars.PARAMETER_PATH }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment inputs
        id: deployment
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployment must run from main, got: $GITHUB_REF" >&2
            exit 1
          fi

          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY EC2_INSTANCE_ID PARAMETER_PATH HEALTHCHECK_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment variable: $name" >&2
              exit 1
            fi
          done

          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo "Invalid AWS_REGION" >&2; exit 1; }
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || { echo "Invalid AWS_ROLE_ARN" >&2; exit 1; }
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo "Invalid ECR_REPOSITORY" >&2; exit 1; }
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]] || { echo "Invalid EC2_INSTANCE_ID" >&2; exit 1; }
          [[ "$PARAMETER_PATH" =~ ^/[A-Za-z0-9_.\/-]+$ ]] || { echo "Invalid PARAMETER_PATH" >&2; exit 1; }
          [[ "$HEALTHCHECK_URL" == https://* ]] || { echo "HEALTHCHECK_URL must use HTTPS" >&2; exit 1; }

          image_tag=${REQUESTED_IMAGE_TAG:-$GITHUB_SHA}
          [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full lowercase commit SHA" >&2; exit 1; }

          if [[ -n "${REQUESTED_IMAGE_TAG:-}" ]]; then
            echo "build_image=false" >>"$GITHUB_OUTPUT"
          else
            echo "build_image=true" >>"$GITHUB_OUTPUT"
          fi
          echo "image_tag=$image_tag" >>"$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: twigtree-production-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve application image
        id: image
        env:
          IMAGE_TAG: ${{ steps.deployment.outputs.image_tag }}
          BUILD_IMAGE: ${{ steps.deployment.outputs.build_image }}
        shell: bash
        run: |
          set -euo pipefail
          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
            if [[ "$BUILD_IMAGE" == "false" ]]; then
              echo "Requested rollback image does not exist: $IMAGE_TAG" >&2
              exit 1
            fi
          fi

      - name: Set up Docker Buildx
        if: ${{ steps.deployment.outputs.build_image == 'true' && steps.image.outputs.exists == 'false' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push application image
        if: ${{ steps.deployment.outputs.build_image == 'true' && steps.image.outputs.exists == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.deployment.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy through SSM Run Command
        id: ssm
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.deployment.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          app_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          commands=$(jq -cn \
            --arg repository_url "$repository_url" \
            --arg source_sha "$GITHUB_SHA" \
            --arg region "$AWS_REGION" \
            --arg app_image "$app_image" \
            --arg image_tag "$IMAGE_TAG" \
            --arg parameter_path "$PARAMETER_PATH" \
            --arg healthcheck_url "$HEALTHCHECK_URL" \
            '[
              "set -eu",
              "install -d -o ubuntu -g ubuntu /opt/twigtree",
              ("if ! sudo -u ubuntu git -C /opt/twigtree rev-parse --git-dir >/dev/null 2>&1; then sudo -u ubuntu git clone --filter=blob:none " + ($repository_url | @sh) + " /opt/twigtree; fi"),
              "sudo -u ubuntu git -C /opt/twigtree diff --quiet",
              "sudo -u ubuntu git -C /opt/twigtree diff --cached --quiet",
              ("sudo -u ubuntu git -C /opt/twigtree fetch --depth=1 origin " + ($source_sha | @sh)),
              ("sudo -u ubuntu git -C /opt/twigtree checkout --detach " + ($source_sha | @sh)),
              (["sudo", "-u", "ubuntu", "env", ("AWS_REGION=" + $region), ("APP_IMAGE=" + $app_image), ("DEPLOY_SHA=" + $image_tag), ("PARAMETER_PATH=" + $parameter_path), ("HEALTHCHECK_URL=" + $healthcheck_url), "/opt/twigtree/deploy/aws/deploy.sh"] | map(@sh) | join(" "))
            ]')
          parameters=$(jq -cn --argjson commands "$commands" '{commands: $commands}')

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG} from GitHub Actions run ${GITHUB_RUN_ID}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"

          for _ in {1..90}; do
            invocation=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)
            status=$(jq -r '.Status // "Pending"' <<<"$invocation")

            case "$status" in
              Success)
                jq -r '.StandardOutputContent' <<<"$invocation"
                exit 0
                ;;
              Cancelled|TimedOut|Failed|Cancelling)
                jq -r '.StandardOutputContent, .StandardErrorContent' <<<"$invocation" >&2
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 10
                ;;
              *)
                echo "Unknown SSM command status: $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM command: $command_id" >&2
          exit 1

      - name: Write deployment summary
        if: ${{ success() }}
        env:
          IMAGE_TAG: ${{ steps.deployment.outputs.image_tag }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        shell: bash
        run: |
          {
            echo "### Production deployment"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- SSM command: \`$COMMAND_ID\`"
            echo "- Health check: $HEALTHCHECK_URL"
          } >>"$GITHUB_STEP_SUMMARY"
