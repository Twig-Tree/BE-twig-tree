plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tree'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.1'

	// flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// 문서 본문 추출 (트리 생성 입력용). 포맷별로 필요한 것만 추가한다.
	implementation 'org.apache.pdfbox:pdfbox:3.0.7'          // pdf
	implementation 'org.apache.poi:poi-ooxml:5.5.1'          // docx
	implementation 'kr.dogfoot:hwplib:1.1.10'                // hwp (한글 바이너리)
	implementation 'kr.dogfoot:hwpxlib:1.0.9'                // hwpx (한글 XML)
}

tasks.named('test') {
	useJUnitPlatform()
}

// .env 자동 탐색 및 주입 (bootRun 전용)
//
// docker compose 는 compose.yaml 의 ${...} 를 .env 로 치환해 주지만, ./gradlew bootRun 은
// 그런 장치가 없어 지금까지 IDE 실행 설정에 값을 손으로 넣어야 했다. 그 설정은 .idea 라 커밋되지 않는다.
// 여기서 .env 를 읽어 bootRun 의 환경변수로 넘겨, 커밋된 설정만으로 로컬 실행이 되게 한다.
//
// 규칙 3가지:
//  1. 파일이 없으면 조용히 건너뛴다. Dockerfile 의 bootJar 는 .dockerignore 때문에 .env 없이 돌아간다.
//  2. 실제 환경변수가 .env 를 항상 이긴다. docker compose 의 우선순위와 동일하게 맞춘 것으로,
//     컨테이너에서 주입하는 DB_URL(호스트가 db) 이 .env 의 localhost 값에 덮이는 사고를 막는다.
//  3. 첫 '=' 만 구분자로 쓴다. base64 JWT_SECRET 의 패딩이나 URL 쿼리의 '=' 가 값에 섞여도 안전하다.
def loadDotenv(File file) {
	if (!file.exists()) {
		return [:]
	}
	def parsed = [:]
	file.eachLine('UTF-8') { rawLine ->
		def line = rawLine.trim()
		if (line.isEmpty() || line.startsWith('#')) {
			return
		}
		if (line.startsWith('export ')) {
			line = line.substring('export '.length()).trim()
		}
		def separator = line.indexOf('=')
		if (separator <= 0) {
			return
		}
		def key = line.substring(0, separator).trim()
		def value = line.substring(separator + 1).trim()
		def quoted = value.length() >= 2 &&
				((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))
		if (quoted) {
			value = value.substring(1, value.length() - 1)
		}
		parsed[key] = value
	}
	return parsed
}

// .env.local 은 개인용 오버레이. 없으면 무시된다.
def dotenv = loadDotenv(rootProject.file('.env')) + loadDotenv(rootProject.file('.env.local'))
def dotenvToInject = dotenv.findAll { key, value -> System.getenv(key) == null }

// application.yml 에서 기본값 없이 ${...} 로만 쓰이는 키들. 비어 있으면 부팅이 실패한다.
def requiredEnvKeys = ['DB_URL', 'DB_USERNAME', 'DB_PASSWORD', 'JWT_SECRET', 'GOOGLE_CLIENT_IDS']

tasks.named('bootRun') {
	environment dotenvToInject
	doFirst {
		if (dotenv.isEmpty()) {
			logger.warn('[env] .env 를 찾지 못했습니다. cp .env.example .env 로 만드세요. (docs/SETUP.md 방법 B)')
		}
		// 값이 비면 Spring 이 ${JWT_SECRET} 같은 리터럴을 그대로 흘려보내서
		// "Illegal base64 character: '_'" 처럼 원인과 무관한 메시지로 실패한다. 먼저 짚어준다.
		def missing = requiredEnvKeys.findAll { key ->
			def value = System.getenv(key) ?: dotenv[key]
			value == null || value.trim().isEmpty()
		}
		if (!missing.isEmpty()) {
			logger.warn("[env] 값이 비어 있는 필수 항목: ${missing.join(', ')}")
			logger.warn('[env] 이대로 부팅하면 원인과 무관한 메시지로 실패합니다. docs/SETUP.md 참고')
		}
	}
}
