# 배포 환경 오버라이드. compose.prod.yaml 이 SPRING_PROFILES_ACTIVE=prod 로 활성화한다.
# 개발용 SQL 로깅은 1GB 인스턴스에서 디스크와 CPU를 모두 갉아먹으므로 끈다.

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.orm.jdbc.bind: info

server:
  # Caddy가 전달한 X-Forwarded-Proto 등을 처리해 원래 HTTPS 요청을 인식한다.
  forward-headers-strategy: native

auth:
  cookie:
    secure: true

cors:
  allowed-origins:
    - https://app.twig-tree.com
    - https://api.twig-tree.com

# 사용자 테스트 기간 동안 신규 가입 회원에게 시드 트리(resources/seed/tester-tree.json)를 넣어 준다.
# 테스트가 끝나면 이 설정을 지우고 다시 배포한다.
tester-seed:
  enabled: true
