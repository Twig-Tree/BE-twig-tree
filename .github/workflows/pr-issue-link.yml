name: Auto Link Issue
on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  link-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Fill issue number into PR body
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const body = context.payload.pull_request.body;

            // 브랜치명 규칙: <type>/#<issue_number>-<description> (예: chore/#77-pr-assignee)
            const match = branch.match(/^[a-z]+\/#(\d+)-/);
            if (!match) return;

            const issueNumber = match[1];
            const placeholder = '#{issue_number}';

            if (!body || !body.includes(placeholder)) return; // 템플릿을 안 썼거나 이미 채워져 있으면 건너뜀

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body.replace(placeholder, `#${issueNumber}`)
            });
