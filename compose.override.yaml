# 로컬 개발 전용 설정. `docker compose up` 시 compose.yaml 과 함께 자동으로 병합된다.
# 앱 접속과 DB/Redis 확인을 위해 호스트에 포트를 열어둔다.
# 배포 시에는 -f 로 파일을 명시하므로 이 파일은 적용되지 않는다. (docs/SETUP.md 참고)
#
# 세 포트 모두 127.0.0.1 에만 바인딩한다. 호스트 IP 를 생략하면 Docker 가
# 0.0.0.0 으로 공개해 같은 네트워크의 다른 기기에서도 붙을 수 있다.
# 특히 redis 는 requirepass 가 없어 포트만 닿으면 무인증으로 접속된다.
# dockerd 가 nat 테이블에 DNAT 규칙을 넣기 때문에 호스트 방화벽(ufw 등)으로는
# 막히지 않으므로, 바인딩 주소로 제한하는 것이 사실상 유일한 방어다.
#
# 다른 기기에서 로컬 서버에 붙어야 한다면 이 파일을 각자 환경에서만 되돌린다.

services:
  app:
    ports:
      - "127.0.0.1:8080:8080"

  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
